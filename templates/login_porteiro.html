<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Portaria</title>
    <style>
        body { font-family: Arial, sans-serif; background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 350px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button.btn-login { background: #333; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-voltar { background: #6c757d; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <button class="btn-voltar" onclick="location.href='/'">🏠 Voltar ao Início</button>
    <h2>🛡️ Login da Portaria</h2>
    <form autocomplete="off" onsubmit="loginPorteiro(event)">
        <input type="text" id="matricula" placeholder="Digite sua Matrícula" autocomplete="off" required>
        <input type="password" id="senha" placeholder="Sua Senha" autocomplete="new-password" required>
        <button type="submit" class="btn-login">Entrar na Portaria</button>
    </form>
</div>

<script>
async function loginPorteiro(e) {
    e.preventDefault();
    const matricula = document.getElementById('matricula').value;
    const senha = document.getElementById('senha').value;

    const res = await fetch('/api/porteiro/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ matricula, senha })
    });

    const json = await res.json();
    if (res.ok) {
        window.location.href = '/portaria';
    } else {
        alert("⚠️ " + json.erro);
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria - Gestão de Encomendas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .card { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .btn-top { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: #dc3545; color: white; float: right; }
        input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        .btn-entregar { background: #17a2b8; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        .status-pendente { color: #d9534f; font-weight: bold; }
        .status-entregue { color: #28a745; font-weight: bold; }
        .info-retirada { font-size: 12px; color: #555; }
        .btn-whats { background: #25d366; color: white; border: none; padding: 6px 10px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 4px; font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <button class="btn-top" onclick="location.href='/logout'">🚪 Sair</button>
    <h2>🛡️ Painel da Portaria</h2>

    <h3>📦 Registrar Nova Encomenda</h3>
    <form id="form-encomenda" onsubmit="registrarEncomenda(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px;">
        <input type="number" id="bloco" placeholder="Bloco" required onchange="carregarMoradores()">
        <input type="number" id="apartamento" placeholder="Apartamento" required onchange="carregarMoradores()">
        
        <select id="morador_id" required>
            <option value="">Selecione o Morador...</option>
        </select>

        <select id="tipo_encomenda" required>
            <option value="Caixa/Pacote">Caixa/Pacote</option>
            <option value="Envelope/Carta">Envelope/Carta</option>
            <option value="Saco/Sacola">Saco/Sacola</option>
            <option value="Outros">Outros</option>
        </select>

        <!-- SELEÇÃO DE TRANSPORTADORA EM VEZ DE DIGITAÇÃO -->
        <select id="empresa_entrega" required>
            <option value="">Selecione a Transportadora...</option>
            <option value="Amazon">Amazon</option>
            <option value="Mercado Livre">Mercado Livre</option>
            <option value="Shopee">Shopee</option>
            <option value="Correios">Correios</option>
            <option value="Loggi">Loggi</option>
            <option value="Jadlog">Jadlog</option>
            <option value="DHL">DHL</option>
            <option value="FedEx">FedEx</option>
            <option value="Magalu">Magalu</option>
            <option value="Entregador Local / Outros">Entregador Local / Outros</option>
        </select>

        <input type="file" id="foto" accept="image/*">

        <button type="submit" style="background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; grid-column: 1 / -1;">Registrar Encomenda</button>
    </form>
</div>

<div class="card">
    <h3>🔍 Encomendas Registradas</h3>
    <input type="text" id="busca" placeholder="Pesquisar por morador, bloco, apartamento, protocolo ou transportadora..." onkeyup="buscarEncomendas()" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">

    <table>
        <thead>
            <tr>
                <th>Protocolo</th>
                <th>Bloco/Apto</th>
                <th>Morador</th>
                <th>Transportadora</th>
                <th>Recebido Por</th>
                <th>Data Recebimento</th>
                <th>Status</th>
                <th>Retirado Por / Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tb-encomendas">
            <tr><td colspan="9" style="text-align:center;">Carregando encomendas...</td></tr>
        </tbody>
    </table>
</div>

<script>
async function carregarMoradores() {
    const bloco = document.getElementById('bloco').value;
    const apartamento = document.getElementById('apartamento').value;
    const select = document.getElementById('morador_id');

    if (bloco && apartamento) {
        const res = await fetch(`/api/moradores/buscar/${bloco}/${apartamento}`);
        const moradores = await res.json();
        select.innerHTML = '<option value="">Selecione o Morador...</option>';
        moradores.forEach(m => {
            select.innerHTML += `<option value="${m.id}" data-tel="${m.celular}">${m.nome}</option>`;
        });
    }
}

async function registrarEncomenda(e) {
    e.preventDefault();
    const formData = new FormData();
    const bloco = document.getElementById('bloco').value;
    const apartamento = document.getElementById('apartamento').value;
    const moradorSelect = document.getElementById('morador_id');
    const morador_id = moradorSelect.value;
    const nomeMorador = moradorSelect.options[moradorSelect.selectedIndex].text;
    const tipo = document.getElementById('tipo_encomenda').value;
    const empresa = document.getElementById('empresa_entrega').value;

    formData.append('bloco', bloco);
    formData.append('apartamento', apartamento);
    formData.append('morador_id', morador_id);
    formData.append('tipo_encomenda', tipo);
    formData.append('empresa_entrega', empresa);
    
    const fotoFile = document.getElementById('foto').files[0];
    if (fotoFile) {
        formData.append('foto', fotoFile);
    }

    const res = await fetch('/api/encomendas', {
        method: 'POST',
        body: formData
    });

    const json = await res.json();
    if (res.ok) {
        alert("✅ " + json.mensagem);

        // DISPARO E AVISO VIA WHATSAPP
        if (json.celular_morador) {
            let telLimpo = json.celular_morador.replace(/\D/g, "");
            if (!telLimpo.startsWith("55")) telLimpo = "55" + telLimpo;

            const mensagem = `Olá, ${json.nome_morador || nomeMorador}! 📦\n\nUma encomenda (${tipo}) da transportadora *${empresa}* chegou para você na portaria.\n*Protocolo:* #${json.protocolo}\n*Bloco:* ${bloco} - *Apto:* ${apartamento}.\n\nPor favor, retire na portaria quando possível!`;
            
            const linkWhatsapp = `https://api.whatsapp.com/send?phone=${telLimpo}&text=${encodeURIComponent(mensagem)}`;
            window.open(linkWhatsapp, '_blank');
        }

        document.getElementById('form-encomenda').reset();
        buscarEncomendas();
    } else {
        alert("⚠️ " + json.erro);
    }
}

async function buscarEncomendas() {
    const q = document.getElementById('busca').value;
    const res = await fetch(`/api/encomendas/busca?q=${encodeURIComponent(q)}`);
    const tb = document.getElementById('tb-encomendas');

    if (res.ok) {
        const encomendas = await res.json();
        if (encomendas.length === 0) {
            tb.innerHTML = '<tr><td colspan="9" style="text-align:center;">Nenhuma encomenda encontrada.</td></tr>';
            return;
        }

        tb.innerHTML = encomendas.map(e => {
            let fotoBtn = e.foto_url ? `<br><a href="${e.foto_url}" target="_blank">📷 Ver Foto</a>` : '';
            let statusClasse = e.status === 'Pendente' ? 'status-pendente' : 'status-entregue';
            
            // Botão do WhatsApp para renotificar morador se pendente
            let whatsBtn = '';
            if (e.status === 'Pendente' && e.celular_morador) {
                let tel = e.celular_morador.replace(/\D/g, "");
                if (!tel.startsWith("55")) tel = "55" + tel;
                let msg = `Olá, ${e.nome_morador}! 📦 Lembramos que sua encomenda da *${e.empresa_entrega}* (Protocolo #${e.protocolo_anual}) está aguardando retirada na portaria.`;
                whatsBtn = `<br><a href="https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}" target="_blank" class="btn-whats">💬 Notificar Whats</a>`;
            }

            let acaoBtn = e.status === 'Pendente' 
                ? `<button class="btn-entregar" onclick="darBaixa(${e.id})">Entregar</button>${whatsBtn}${fotoBtn}`
                : `<span style="color:#28a745; font-weight:bold;">Concluído</span>${fotoBtn}`;

            let infoRetirada = e.status === 'Entregue' 
                ? `<b>${e.retirado_por || 'Próprio Morador'}</b><br><span class="info-retirada">${e.data_retirada || ''}</span>`
                : '<span style="color:#888;">Aguardando</span>';

            return `
                <tr>
                    <td>#${e.protocolo_anual}</td>
                    <td>Bl ${e.bloco} - Ap ${e.apartamento}</td>
                    <td>${e.nome_morador || 'N/I'}</td>
                    <td>${e.empresa_entrega}</td>
                    <td>${e.porteiro_nome || 'Portaria'}</td>
                    <td>${e.data_recebimento}</td>
                    <td class="${statusClasse}">${e.status}</td>
                    <td>${infoRetirada}</td>
                    <td>${acaoBtn}</td>
                </tr>
            `;
        }).join('');
    }
}

async function darBaixa(id) {
    const retirado_por = prompt("Quem está a retirar a encomenda?", "Próprio Morador");
    if (retirado_por !== null) {
        const res = await fetch(`/api/encomendas/${id}/retirar`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ retirado_por: retirado_por.trim() || 'Próprio Morador' })
        });
        if (res.ok) {
            buscarEncomendas();
        }
    }
}

buscarEncomendas();
</script>
</body>
</html>

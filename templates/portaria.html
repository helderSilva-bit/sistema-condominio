<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Portaria</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .btn-voltar { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .form-group { margin-top: 10px; }
        input, select, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button.btn-salvar { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
<div class="container">
    <button class="btn-voltar" onclick="location.href='/logout'">🚪 Sair / Voltar ao Início</button>
    <h2>📦 Painel de Recepção de Encomendas</h2>

    <form id="formEnc" onsubmit="salvar(event)">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Bloco:</label>
                <input type="number" id="bloco" required onchange="carregarMoradores()">
            </div>
            <div style="flex: 1;">
                <label>Apartamento:</label>
                <input type="number" id="apartamento" required onchange="carregarMoradores()">
            </div>
        </div>

        <div class="form-group">
            <label>Destinatário (Morador):</label>
            <select id="morador_id" required>
                <option value="">Preencha o Bloco e Apartamento...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tipo de Encomenda:</label>
            <select id="tipo" required>
                <option value="Caixa">Caixa</option>
                <option value="Envelope">Envelope</option>
                <option value="Sacola">Sacola</option>
                <option value="Pacote Pequeno">Pacote Pequeno</option>
            </select>
        </div>

        <div class="form-group">
            <label>Empresa de Entrega / Transportadora:</label>
            <select id="empresa" required>
                <option value="Mercado Livre">Mercado Livre</option>
                <option value="Correios">Correios</option>
                <option value="Shopee">Shopee</option>
                <option value="Amazon">Amazon</option>
                <option value="Jadlog">Jadlog</option>
                <option value="Loggi">Loggi</option>
                <option value="Outros">Outros / Entregador</option>
            </select>
        </div>

        <div class="form-group">
            <label>Foto do Pacote:</label>
            <input type="file" id="foto" accept="image/*">
        </div>

        <button type="submit" class="btn-salvar">Registrar e Notificar WhatsApp</button>
    </form>

    <hr style="margin-top: 30px;">

    <h3>🔍 Encomendas Cadastradas</h3>
    <input type="text" id="busca" placeholder="Pesquisar por nome, bloco, apartamento, protocolo ou transportadora..." onkeyup="pesquisar()">
    
    <table>
        <thead>
            <tr>
                <th>Protocolo</th>
                <th>Bloco/Apto</th>
                <th>Morador</th>
                <th>Transportadora</th>
                <th>Recebido Por</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>
</div>

<script>
async function carregarMoradores() {
    const bloco = document.getElementById('bloco').value;
    const ap = document.getElementById('apartamento').value;
    const select = document.getElementById('morador_id');

    if (!bloco || !ap) return;

    const res = await fetch(`/api/moradores/buscar/${bloco}/${ap}`);
    const moradores = await res.json();

    select.innerHTML = '';
    if (moradores.length === 0) {
        select.innerHTML = '<option value="">Nenhum morador cadastrado nesta unidade</option>';
        return;
    }

    moradores.forEach(m => {
        select.innerHTML += `<option value="${m.id}">${m.nome} (Tel: ${m.celular})</option>`;
    });
}

async function salvar(e) {
    e.preventDefault();
    const formData = new FormData();
    formData.append('bloco', document.getElementById('bloco').value);
    formData.append('apartamento', document.getElementById('apartamento').value);
    formData.append('morador_id', document.getElementById('morador_id').value);
    formData.append('tipo_encomenda', document.getElementById('tipo').value);
    formData.append('empresa_entrega', document.getElementById('empresa').value);
    
    if (document.getElementById('foto').files[0]) {
        formData.append('foto', document.getElementById('foto').files[0]);
    }

    const res = await fetch('/api/encomendas', { method: 'POST', body: formData });
    const json = await res.json();
    alert(json.mensagem);

    if (json.celular_morador) {
        let num = json.celular_morador.replace(/\D/g, '');
        if (!num.startsWith('55')) num = '55' + num;

        const txt = encodeURIComponent(
            `📦 *Aviso de Encomenda - Portaria*\n\n` +
            `Olá, *${json.nome_morador}*!\n` +
            `Chegou uma encomenda para você.\n\n` +
            `• *Protocolo Anual:* #${json.protocolo}\n` +
            `• *Transportadora:* ${json.empresa}\n` +
            `• *Recebido por:* ${json.porteiro_nome}\n\n` +
            `Pode vir retirar na portaria!`
        );

        const urlWhatsapp = `https://api.whatsapp.com/send?phone=${num}&text=${txt}`;
        window.open(urlWhatsapp, '_blank');
    }

    document.getElementById('formEnc').reset();
    pesquisar();
}

async function pesquisar() {
    const q = document.getElementById('busca').value;
    const res = await fetch(`/api/encomendas/busca?q=${q}`);
    const encomendas = await res.json();
    const tabela = document.getElementById('tabela');

    tabela.innerHTML = '';
    encomendas.forEach(enc => {
        tabela.innerHTML += `
            <tr>
                <td>#${enc.protocolo_anual}</td>
                <td>Bl ${enc.bloco} - Ap ${enc.apartamento}</td>
                <td>${enc.nome_morador || 'N/I'}</td>
                <td>${enc.empresa_entrega}</td>
                <td>${enc.porteiro_nome || 'Portaria'}</td>
                <td>${enc.data_recebimento}</td>
                <td><b>${enc.status}</b></td>
                <td>
                    ${enc.status === 'Pendente' ? `<button onclick="darBaixa(${enc.id})">Entregar</button>` : 'Entregue'}
                </td>
            </tr>
        `;
    });
}

async function darBaixa(id) {
    const retirado_por = prompt("Nome da pessoa que está retirando:");
    if (!retirado_por) return;

    await fetch(`/api/encomendas/${id}/retirar`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ retirado_por })
    });

    pesquisar();
}

pesquisar();
</script>
</body>
</html>

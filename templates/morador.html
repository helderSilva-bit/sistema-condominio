<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Encomendas - Condomínio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .card { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-top { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; margin-right: 10px; text-decoration: none; display: inline-block; }
        .btn-sair { background: #dc3545; color: white; }
        .btn-edit { background: #007bff; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #28a745; color: white; }
        .status-pendente { color: #d9534f; font-weight: bold; }
        .status-entregue { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <h2 id="boas-vindas">Olá, Morador!</h2>
        <div>
            <a href="/meu-cadastro" class="btn-top btn-edit">✏️ Meu Cadastro</a>
            <button class="btn-top btn-sair" onclick="location.href='/logout'">🚪 Sair</button>
        </div>
    </div>

    <h3>📦 Suas Correspondências</h3>

    <table>
        <thead>
            <tr>
                <th>Protocolo</th>
                <th>Tipo</th>
                <th>Transportadora</th>
                <th>Data Recebimento</th>
                <th>Status</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody id="tb-encomendas">
            <tr><td colspan="6" style="text-align:center;">Carregando encomendas...</td></tr>
        </tbody>
    </table>
</div>

<script>
async function carregarDadosMorador() {
    try {
        const resM = await fetch('/api/morador/meus-dados');
        if (resM.ok) {
            const m = await resM.json();
            document.getElementById('boas-vindas').innerText = `Olá, ${m.nome} (Apto ${m.apartamento})`;
        }
    } catch(e) { console.error(e); }

    const tb = document.getElementById('tb-encomendas');
    try {
        const resE = await fetch('/api/morador/minhas-encomendas');
        if (resE.ok) {
            const encomendas = await resE.json();
            if (!Array.isArray(encomendas) || encomendas.length === 0) {
                tb.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhuma encomenda recebida até o momento.</td></tr>';
                return;
            }

            tb.innerHTML = encomendas.map(e => {
                let fotoBtn = e.foto_url ? `<a href="${e.foto_url}" target="_blank">📷 Ver Foto</a>` : 'Sem Foto';
                let statusClasse = e.status === 'Pendente' ? 'status-pendente' : 'status-entregue';
                return `
                    <tr>
                        <td>#${e.protocolo_anual}</td>
                        <td>${e.tipo_encomenda}</td>
                        <td>${e.empresa_entrega}</td>
                        <td>${e.data_recebimento}</td>
                        <td class="${statusClasse}">${e.status}</td>
                        <td>${fotoBtn}</td>
                    </tr>
                `;
            }).join('');
        } else {
            tb.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Erro ao carregar correspondências.</td></tr>';
        }
    } catch(e) {
        tb.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Erro na conexão com o servidor.</td></tr>';
    }
}

carregarDadosMorador();
</script>
</body>
</html>

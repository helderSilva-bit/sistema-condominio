<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Morador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e9ecef; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; }
        .item { border: 1px solid #ddd; padding: 12px; margin-top: 10px; border-radius: 8px; }
        .img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2 id="boasVindas"></h2>
    <h3>📦 Suas Correspondências</h3>
    <div id="lista"></div>
    <button onclick="location.href='/'" style="margin-top:20px;">Sair</button>
</div>

<script>
    const data = JSON.parse(sessionStorage.getItem('moradorData'));
    if (!data) {
        window.location.href = '/login-morador';
    } else {
        document.getElementById('boasVindas').innerText = `Olá, ${data.morador.nome} (Apto ${data.morador.apartamento})`;
        const div = document.getElementById('lista');

        if (data.encomendas.length === 0) {
            div.innerHTML = '<p>Nenhuma encomenda pendente ou registrada.</p>';
        } else {
            data.encomendas.forEach(e => {
                div.innerHTML += `
                    <div class="item">
                        <b>Protocolo:</b> #${e.protocolo_diario} | <b>Status:</b> ${e.status}<br>
                        <b>Tipo:</b> ${e.tipo_encomenda}<br>
                        <small>Chegou em: ${e.data_recebimento}</small><br>
                        ${e.foto_url ? `<img src="${e.foto_url}" class="img-preview">` : ''}
                    </div>
                `;
            });
        }
    }
</script>
</body>
</html>

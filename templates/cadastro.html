<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Morador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 420px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>📱 Cadastro de Morador</h2>
    <form onsubmit="cadastrar(event)">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="tel" id="celular" placeholder="Celular com DDD (Ex: 61999999999)" required>
        <input type="text" id="cpf" placeholder="CPF" required>
        <input type="password" id="senha" placeholder="Crie uma Senha" required>
        
        <label>Bloco:</label>
        <select id="bloco" required></select>

        <label>Apartamento:</label>
        <select id="apartamento" required></select>

        <button type="submit">Finalizar Cadastro</button>
    </form>
</div>

<script>
    const totalBlocos = 28;
    const apartamentos = [101, 102, 201, 202, 203, 204, 301, 302, 303, 304, 401, 402, 403, 404];

    const selB = document.getElementById('bloco');
    for (let i = 1; i <= totalBlocos; i++) {
        selB.innerHTML += `<option value="${i}">Bloco ${i}</option>`;
    }

    const selA = document.getElementById('apartamento');
    apartamentos.forEach(a => selA.innerHTML += `<option value="${a}">${a}</option>`);

    async function cadastrar(e) {
        e.preventDefault();
        const dados = {
            nome: document.getElementById('nome').value,
            celular: document.getElementById('celular').value,
            cpf: document.getElementById('cpf').value,
            senha: document.getElementById('senha').value,
            bloco: selB.value,
            apartamento: selA.value
        };

        const res = await fetch('/api/moradores/cadastrar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });
        const json = await res.json();
        if (res.ok) {
            alert(json.mensagem);
            window.location.href = '/login-morador';
        } else {
            alert("⚠️ " + json.erro);
        }
    }
</script>
</body>
</html>

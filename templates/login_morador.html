<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Morador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔑 Login do Morador</h2>
    <input type="text" id="cpf" placeholder="Digite seu CPF">
    <input type="password" id="senha" placeholder="Sua Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p style="text-align: center;"><a href="/cadastro">Não tem conta? Cadastre-se</a></p>
</div>

<script>
async function fazerLogin() {
    const cpf = document.getElementById('cpf').value;
    const senha = document.getElementById('senha').value;

    const res = await fetch('/api/morador/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf, senha })
    });

    const dados = await res.json();
    if (res.ok) {
        sessionStorage.setItem('moradorData', JSON.stringify(dados));
        window.location.href = '/morador';
    } else {
        alert("⚠️ " + dados.erro);
    }
}
</script>
</body>
</html>

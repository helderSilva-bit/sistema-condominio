<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Encomendas - Condomínio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #333; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; margin-bottom: 25px; }
        .btn-opcao { display: block; width: 100%; padding: 14px; margin: 12px 0; border-radius: 6px; border: none; font-size: 16px; font-weight: bold; text-decoration: none; color: white; box-sizing: border-box; cursor: pointer; }
        .btn-porteiro { background: #007bff; }
        .btn-morador { background: #28a745; }
        .btn-admin { background: #d9534f; }
        .btn-opcao:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="card">
    <h1>📦 Sistema de Gestão de Encomendas</h1>
    <p>Selecione o seu tipo de acesso:</p>

    <a href="/login-porteiro" class="btn-opcao btn-porteiro">🛡️ Acesso Portaria</a>
    <a href="/login-morador" class="btn-opcao btn-morador">🏠 Acesso Morador</a>
    <a href="/login-admin" class="btn-opcao btn-admin">⚙️ Painel Administrador</a>
</div>
</body>
</html>

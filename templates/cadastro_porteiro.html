<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Porteiro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 380px; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button.btn-cadastrar { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-voltar { background: #6c757d; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <button class="btn-voltar" onclick="location.href='/admin-dashboard'">🏠 Voltar ao Painel</button>
    <h2>🛡️ Cadastro de Porteiro</h2>
    
    <form autocomplete="off" onsubmit="cadastrar(event)">
        <label style="display:block; text-align:left; font-weight:bold; margin-top:10px;">Selecione o Condomínio:</label>
        <select id="condominio_id" required>
            <option value="">Carregando condomínios...</option>
        </select>
        <input type="text" id="nome" placeholder="Nome Completo do Porteiro" required>
        <input type="text" id="matricula" placeholder="Matrícula Funcional (Ex: 0001)" required>
        <input type="password" id="senha" placeholder="Cadastrar Senha" autocomplete="new-password" required>
        <button type="submit" class="btn-cadastrar">Cadastrar Porteiro</button>
    </form>
</div>

<script>
async function carregarCondominios() {
    try {
        const res = await fetch('/api/admin/condominios');
        const list = await res.json();
        const select = document.getElementById('condominio_id');
        select.innerHTML = '';
        
        if (Array.isArray(list) && list.length > 0) {
            list.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
            });
        } else {
            select.innerHTML = '<option value="1">Condomínio Padrão</option>';
        }
    } catch(e) {
        document.getElementById('condominio_id').innerHTML = '<option value="1">Condomínio Padrão</option>';
    }
}

async function cadastrar(e) {
    e.preventDefault();
    const condominio_id = document.getElementById('condominio_id').value;
    const nome = document.getElementById('nome').value;
    const matricula = document.getElementById('matricula').value;
    const senha = document.getElementById('senha').value;

    const res = await fetch('/api/porteiro/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ condominio_id, nome, matricula, senha })
    });

    const json = await res.json();
    if (res.ok) {
        alert("✅ " + json.mensagem);
        window.location.href = '/admin-dashboard';
    } else {
        alert("⚠️ " + (json.erro || "Erro no cadastro do porteiro"));
    }
}

carregarCondominios();
</script>
</body>
</html>
